# ExamGrapher is a pre-generated static site. Pages are produced by `python3 scripts/build.py`
# from scripts/pages.json and committed, so Netlify only needs to publish the folder.
[build]
  publish = "."
  command = ""

# Generator scripts and data are not part of the public site
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Consolidated duplicate pages (301 permanent redirects)
[[redirects]]
  from = "/trigonometry/trigonometric-function-grapher"
  to = "/trigonometry/trig-graphing-calculator/"
  status = 301
  force = true

[[redirects]]
  from = "/trigonometry/trigonometric-function-grapher/"
  to = "/trigonometry/trig-graphing-calculator/"
  status = 301
  force = true

[[redirects]]
  from = "/functions/logarithm-grapher"
  to = "/functions/logarithmic-graphing-calculator/"
  status = 301
  force = true

[[redirects]]
  from = "/functions/logarithm-grapher/"
  to = "/functions/logarithmic-graphing-calculator/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# CSS/JS are cache-busted with ?v=ASSET_V, so they can be cached for a long time
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Robots-Tag = "noindex"
